# charts/docvector/values.yaml
replicaCount:
  api: 1
  nginx: 1

# Container Registry
registry: ghcr.io
imagePullSecrets: []

image:
  api:
    repository: ghcr.io/docvector-api
    tag: ""
    pullPolicy: IfNotPresent
  nginx:
    repository: ghcr.io/docvector-nginx
    tag: ""
    pullPolicy: IfNotPresent

namespace:
  name: docvector

# Storage
persistence:
  enabled: true
  storageClass: "standard"
  accessMode: ReadWriteOnce
  size: 10Gi

# API Configuration
api:
  resources:
    requests:
      memory: "1Gi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "1000m"
  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# Nginx Configuration
nginx:
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  clientMaxBodySize: "100m"

# Service
service:
  api:
    type: ClusterIP
    port: 8000
  nginx:
    type: ClusterIP
    port: 80

# Autoscaling (optionnel)
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

secrets:
  create: true
  name: docvector-secrets
  data:
    OPENSEARCH_HOST: "opensearch.opensearch.svc.cluster.local"
    OPENSEARCH_PORT: "9200"
    OPENSEARCH_USER: "admin"
    OPENSEARCH_PASSWORD: "Password"
    OPENSEARCH_USE_SSL: "true"
    OPENSEARCH_VERIFY_CERTS: "false"
    INDEX_NAME: "index_base"

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}