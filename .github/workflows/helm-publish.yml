# .github/workflows/helm-publish.yml
name: Helm Chart Package & Publish

on:
  push:
    branches: [ main ]
    paths:
      - 'charts/**'
      - 'values.yaml'
      - 'ingress.yaml'
      - '.github/workflows/helm-publish.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  package-and-publish:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Helm
      uses: azure/setup-helm@v3
      with:
        version: 'latest'

    - name: Generate version
      id: version
      run: |
        VERSION="1.1.20"
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

    - name: Update Chart.yaml
      run: |
        sed -i "s/version: .*/version: ${{ steps.version.outputs.version }}/" charts/docvector/Chart.yaml
        sed -i "s/appVersion: .*/appVersion: \"${{ steps.version.outputs.version }}\"/" charts/docvector/Chart.yaml
        sed -i "s|{{ github_username }}|${{ github.repository_owner }}|g" charts/docvector/Chart.yaml
        sed -i "s|{{ github_username }}|${{ github.repository_owner }}|g" charts/docvector/values.yaml
        cat charts/docvector/Chart.yaml

    - name: Lint Helm chart
      run: helm lint charts/docvector

    - name: Package Helm chart
      run: |
        mkdir -p charts
        helm package charts/docvector -d charts/
        ls -lah charts/

    - name: Create Helm index
      run: |
        if [ -f charts/index.yaml ]; then
          helm repo index charts/ --url https://${{ github.repository_owner }}.github.io/DocVector/ --merge charts/index.yaml
        else
          helm repo index charts/ --url https://${{ github.repository_owner }}.github.io/DocVector/
        fi
        cat charts/index.yaml

    - name: Create documentation
      run: |
        cat > charts/README.md << 'EOF'
        # DocVector Helm Charts
        
        Kubernetes deployment chart for DocVector (API + Frontend + OpenSearch integration).
        
        ## Add Repository
        ```bash
        helm repo add docvector https://${{ github.repository_owner }}.github.io/DocVector/
        helm repo update
        ```
        
        ## Install Chart
        ```bash
        helm upgrade --install docvector docvector/docvector \
          --namespace docvector \
          --create-namespace \
          -f values.yaml \
          -f ingress.yaml
          ```

        ## Default Values (values.yaml)
        ```yaml
          # charts/docvector/values.yaml
          replicaCount:
            api: 1
            nginx: 1

          # Container Registry
          registry: ghcr.io
          imagePullSecrets: []

          image:
            api:
              repository: ghcr.io/docvector-api
              tag: ""
              pullPolicy: IfNotPresent
            nginx:
              repository: ghcr.io/docvector-nginx
              tag: ""
              pullPolicy: IfNotPresent

          namespace:
            name: docvector

          # Storage
          persistence:
            enabled: true
            storageClass: "standard"
            accessMode: ReadWriteOnce
            size: 10Gi

          # API Configuration
          api:
            resources:
              requests:
                memory: "1Gi"
                cpu: "250m"
              limits:
                memory: "2Gi"
                cpu: "1000m"
            livenessProbe:
              enabled: true
              initialDelaySeconds: 30
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
            readinessProbe:
              enabled: true
              initialDelaySeconds: 10
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 3

          # Nginx Configuration
          nginx:
            resources:
              requests:
                memory: "128Mi"
                cpu: "100m"
              limits:
                memory: "256Mi"
                cpu: "200m"
            clientMaxBodySize: "100m"

          # Service
          service:
            api:
              type: ClusterIP
              port: 8000
            nginx:
              type: ClusterIP
              port: 80

          # Autoscaling (optionnel)
          autoscaling:
            enabled: false
            minReplicas: 2
            maxReplicas: 10
            targetCPUUtilizationPercentage: 70
            targetMemoryUtilizationPercentage: 80

          secrets:
            create: true
            name: docvector-secrets
            data:
              OPENSEARCH_HOST: "opensearch.opensearch.svc.cluster.local"
              OPENSEARCH_PORT: "9200"
              OPENSEARCH_USER: "admin"
              OPENSEARCH_PASSWORD: "Password"
              OPENSEARCH_USE_SSL: "true"
              OPENSEARCH_VERIFY_CERTS: "false"
              INDEX_NAME: "index_base"

          # Node selector
          nodeSelector: {}

          # Tolerations
          tolerations: []

          # Affinity
          affinity: {}
          ```

        ## Ingress Configuration (ingress.yaml)
        ```yaml
        ingress:
          enabled: true
          className: "nginx"
          annotations:
            nginx.ingress.kubernetes.io/proxy-body-size: "100m"
            nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
            nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
            # cert-manager.io/cluster-issuer: "letsencrypt-prod"
          hosts:
            - host: docvector.local
              paths:
                - path: /
                  pathType: Prefix
          tls: []
          # - secretName: docvector-tls
          #   hosts:
          #     - docvector.your-domain.com
          ```

        ## Prerequisites
        
        - Kubernetes 1.20+
        - Helm 3.0+
        - Ingress Controller (nginx-ingress recommended)
        - OpenSearch cluster (external or in-cluster)
        
        ## Configuration Files (at repo root)
        
        - `values.yaml` - Helm values (mandatory)
        - `ingress.yaml` - Ingress configuration (mandatory)
        
        ## Quick Start
        
        ### 1. Clone and configure
        ```bash
        git clone https://github.com/${{ github.repository_owner }}/DocVector.git
        cd DocVector/charts/docvector
        
        # Edit OpenSearch connection
        vim values.yaml
        
        # Edit domain
        vim ingress.yaml
        ```
        
        ### 2. Install
        ```bash
        helm install docvector docvector/docvector \
          -n docvector \
          --create-namespace \
          -f values.yaml \
          -f ingress.yaml
        ```
        
        ### 3. Verify
        ```bash
        kubectl get pods -n docvector
        kubectl get ingress -n docvector
        ```
        
        ## Deploy with Ansible (Generic Pipeline)
        ```bash
        ansible-playbook deploy_helm_generic.yml
        
        # Using: https://github.com/iwebbo/Ansible/tree/main/roles/deploy_helmchart_stack_standalone
        ```
        
        ## Chart Values
        
        | Parameter | Description | Default |
        |-----------|-------------|---------|
        | `replicaCount.api` | API replicas | 2 |
        | `replicaCount.nginx` | Frontend replicas | 2 |
        | `image.api.tag` | API image tag | latest |
        | `image.nginx.tag` | Frontend image tag | latest |
        | `opensearch.host` | OpenSearch host | opensearch.opensearch.svc.cluster.local |
        | `persistence.size` | Data volume size | 10Gi |
        | `ingress.enabled` | Enable Ingress | true |
        
        ## Build & Push Flow
        
        1. Push to `api/**` or `src/**` → GitHub Actions builds API image
        2. Push to `front/**` → GitHub Actions builds frontend image
        3. Push to `charts/**` → GitHub Actions packages and publishes chart
        
        ## Upgrade
        ```bash
        helm upgrade docvector docvector/docvector \
          -n docvector \
          -f values.yaml \
          -f ingress.yaml
        ```
        
        ## Uninstall
        ```bash
        helm uninstall docvector -n docvector
        kubectl delete namespace docvector
        ```
        
        ## Storage Class Options
        
        ### Auto-provisioning (Default)
        ```yaml
        persistence:
          storageClass: "standard"  # or "gp2" on AWS, "managed-premium" on Azure
        ```
        
        ### Manual PV (for on-premise)
        ```yaml
        # values.yaml
        persistence:
          storageClass: "local-storage"
        ```
        ```yaml
        # pv-data.yaml
        apiVersion: v1
        kind: PersistentVolume
        metadata:
          name: docvector-data-pv
        spec:
          storageClassName: local-storage
          capacity:
            storage: 10Gi
          accessModes:
            - ReadWriteOnce
          persistentVolumeReclaimPolicy: Retain
          hostPath:
            path: "/mnt/data/docvector"
            type: DirectoryOrCreate
          nodeAffinity:
            required:
              nodeSelectorTerms:
              - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                  - k8s-worker-01
          ```
        ```bash
        kubectl apply -f pv-data.yaml
        helm install docvector docvector/docvector -f values.yaml -f ingress.yaml
        ```
        
        ## Troubleshooting
        ```bash
        # Check pods
        kubectl get pods -n docvector
        
        # Check logs
        kubectl logs -f -n docvector deployment/docvector-api
        kubectl logs -f -n docvector deployment/docvector-nginx
        
        # Check OpenSearch connection
        kubectl exec -it -n docvector deployment/docvector-api -- curl -k https://opensearch:9200
        
        # Port-forward for local testing
        kubectl port-forward -n docvector svc/docvector-nginx 8080:80
        ```
        
        ## Support
        
        Repository: https://github.com/${{ github.repository_owner }}/DocVector
        EOF
        cat charts/README.md

    - name: Checkout gh-pages branch
      uses: actions/checkout@v4
      with:
        ref: gh-pages
        path: gh-pages
        fetch-depth: 0

    - name: Copy charts to gh-pages
      run: |
        mkdir -p gh-pages
        cp -r charts/* gh-pages/
        ls -lah gh-pages/

    - name: Commit and push to gh-pages
      run: |
        cd gh-pages
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add .
        git commit -m "Publishing Helm chart ${{ steps.version.outputs.version }}" || true
        git push origin gh-pages
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create deployment summary
      run: |
        echo "## 📦 Helm Chart Published" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ **Chart Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📍 Repository URL" >> $GITHUB_STEP_SUMMARY
        echo "https://${{ github.repository_owner }}.github.io/DocVector/" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📥 Add Repository" >> $GITHUB_STEP_SUMMARY
        echo '```bash' >> $GITHUB_STEP_SUMMARY
        echo "helm repo add docvector https://${{ github.repository_owner }}.github.io/DocVector/" >> $GITHUB_STEP_SUMMARY
        echo "helm repo update" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🚀 Install" >> $GITHUB_STEP_SUMMARY
        echo '```bash' >> $GITHUB_STEP_SUMMARY
        echo "helm install docvector docvector/docvector -n docvector --create-namespace -f values.yaml -f ingress.yaml" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY