# .github/workflows/helm-publish.yml
name: Helm Chart Package & Publish

on:
  push:
    branches: [ main ]
    paths:
      - 'charts/**'
      - 'values.yaml'
      - 'ingress.yaml'
      - '.github/workflows/helm-publish.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  package-and-publish:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Helm
      uses: azure/setup-helm@v3
      with:
        version: 'latest'

    - name: Generate version
      id: version
      run: |
        VERSION="1.1.22"
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

    - name: Update Chart.yaml
      run: |
        sed -i "s/version: .*/version: ${{ steps.version.outputs.version }}/" charts/docvector/Chart.yaml
        sed -i "s/appVersion: .*/appVersion: \"${{ steps.version.outputs.version }}\"/" charts/docvector/Chart.yaml
        sed -i "s|{{ github_username }}|${{ github.repository_owner }}|g" charts/docvector/Chart.yaml
        sed -i "s|{{ github_username }}|${{ github.repository_owner }}|g" charts/docvector/values.yaml
        cat charts/docvector/Chart.yaml

    - name: Lint Helm chart
      run: helm lint charts/docvector

    - name: Package Helm chart
      run: |
        mkdir -p charts
        helm package charts/docvector -d charts/
        ls -lah charts/

    - name: Create Helm index
      run: |
        if [ -f charts/index.yaml ]; then
          helm repo index charts/ --url https://${{ github.repository_owner }}.github.io/DocVector/ --merge charts/index.yaml
        else
          helm repo index charts/ --url https://${{ github.repository_owner }}.github.io/DocVector/
        fi
        cat charts/index.yaml

    - name: Create documentation
      run: |
        cat > charts/README.md << 'EOF'
        # DocVector Helm Charts
        
        Kubernetes deployment chart for DocVector (API + Frontend + OpenSearch integration).
        
        ## Add Repository
        ```bash
        helm repo add docvector https://${{ github.repository_owner }}.github.io/DocVector/
        helm repo update
        ```
        
        ## Install Chart
        ```bash
        helm upgrade --install docvector docvector/docvector \
          --namespace docvector \
          --create-namespace \
          -f ingress.yaml
          ```

        ## Default Values (values.yaml)
        ```yaml

        opensearch:
          host: "opensearch.opensearch.svc.cluster.local"
          port: "9200"
          user: "admin"
          password: "ChangeMe123!"
          useSSL: "true"
          verifyCerts: "false"
          indexName: "knowledge_base"

          ```

        ## Ingress Configuration (ingress.yaml)
        ```yaml
        ingress:
          enabled: true
          className: "nginx"
          annotations:
            nginx.ingress.kubernetes.io/proxy-body-size: "100m"
            nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
            nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
            # cert-manager.io/cluster-issuer: "letsencrypt-prod"
          hosts:
            - host: docvector.local
              paths:
                - path: /
                  pathType: Prefix
          tls: []
          # - secretName: docvector-tls
          #   hosts:
          #     - docvector.your-domain.com
          ```

        ## Prerequisites
        
        - Kubernetes 1.20+
        - Helm 3.0+
        - Ingress Controller (nginx-ingress recommended)
        - OpenSearch cluster (external or in-cluster)
        
        ## Configuration Files (at repo root)
        
        - `values.yaml` - Helm values (default)
        - `ingress.yaml` - Ingress configuration (mandatory)
        
        ```
        
        ## Support
        
        Repository: https://github.com/${{ github.repository_owner }}/DocVector
        EOF
        cat charts/README.md

    - name: Checkout gh-pages branch
      uses: actions/checkout@v4
      with:
        ref: gh-pages
        path: gh-pages
        fetch-depth: 0

    - name: Copy charts to gh-pages
      run: |
        mkdir -p gh-pages
        cp -r charts/* gh-pages/
        ls -lah gh-pages/

    - name: Commit and push to gh-pages
      run: |
        cd gh-pages
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add .
        git commit -m "Publishing Helm chart ${{ steps.version.outputs.version }}" || true
        git push origin gh-pages
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create deployment summary
      run: |
        echo "## 📦 Helm Chart Published" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ **Chart Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📍 Repository URL" >> $GITHUB_STEP_SUMMARY
        echo "https://${{ github.repository_owner }}.github.io/DocVector/" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📥 Add Repository" >> $GITHUB_STEP_SUMMARY
        echo '```bash' >> $GITHUB_STEP_SUMMARY
        echo "helm repo add docvector https://${{ github.repository_owner }}.github.io/DocVector/" >> $GITHUB_STEP_SUMMARY
        echo "helm repo update" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🚀 Install" >> $GITHUB_STEP_SUMMARY
        echo '```bash' >> $GITHUB_STEP_SUMMARY
        echo "helm install docvector docvector/docvector -n docvector --create-namespace -f values.yaml -f ingress.yaml" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY